[build-system]
requires = ["setuptools~=77.0"]
build-backend = "setuptools.build_meta"

[project]
name         = "ovyon-frontend"
version      = "20260527.0"
license      = "Apache-2.0"
license-files = ["LICENSE*"]
description  = "The OVYON OS frontend"
readme       = "README.md"
authors      = [
    {name = "The OVYON OS Authors", email = "hello@ovyon.io"}
]
requires-python = ">=3.14.0"

[project.urls]
"Homepage" = "https://github.com/ovyon/frontend"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["hass_frontend*"]
